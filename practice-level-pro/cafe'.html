<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400&display=swap">
    
    <style>
        *{
         margin: 0;
         padding: 0;
         box-sizing: border-box;   
        }
        body{
            font-family: 'popins', sans-serif;
            line-height: 1.6;
            color:#332d2d;
            background-color: #fcfaf8;
        }
        /*Navbar*/
        .navbar{
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 5%;
            background-color: #fff;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 10px rgb(0,0,0,0.05);
        }
        .navbar ul{
            display: flex;
            list-style: none;
        }
        .navbar ul li a{
            text-decoration: none;
            color: #332d2d;
            margin-left: 2rem;
            font-weight: 400;
            transition: color 0.3s;
        }
        .navbar ul li a:hover{
            color: #c08261;
        }
       .logo img{
        height: 100px;
        width: auto;
       }
       /*hero*/
       .hero{
        height: 80vh;
        background:linear-gradient(rgb(0,0,0,0.5),rgb(0,0,0,0.5)),
        url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1350&q=80');
        background-size:cover;
        background-position: center;
        display:flex;
        align-items:center;
        text-align:center;
        justify-content: center;
        color: white;
       }
       .navbar2{
        display: flex;
        justify-content: center;
        padding: 1.5rem 5%;
        box-shadow: 0px, 2px, 10px rgb(0,0,0,0.05);
        align-items: center;
        background-color:#F9FBF9;
       }
       .navbar2 img{
        height: 80vh;
        width: 80vh;
       }
       
      
       .menu-grid{
        display:flex;
        justify-content: center;

       }
       .img2 img{
        height:80vh;
        width:100%
       }
       @media (max-width: 1024px) {
        body{
            margin: 0;
            padding: 0;
        }
    .hero-content h1 {
        font-size: 2.5rem; /* Shrink text so it doesn't overflow */
    }
    
    .menu-grid img{
      height: 50vh;
        
    }
}

/* Mobile Styles (Screens smaller than 480px) */
@media (max-width: 480px) {
    body{
        margin: 0;
        padding: 0;
    }
    .navbar {
        flex-direction: column; /* Stack logo above the links */
        gap: 1rem;
    }

    .navbar ul {
        padding: 0;
    }

    .navbar ul li a {
        margin: 0 10px; /* Bring links closer together */
    }
    .menu-grid img{
        height: 35vh;
    }
    
}
    </style>
</head>
<body>
    <header class="navbar">
     <div class="logo"><img src="img4.png" alt=""></div>
     <nav>
     <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#menu">Menu</a></li>
        <li><a href="#About">About</a></li>
        <li><a href="#conatct">Contact</a></li>
     </ul>
     </nav>
    </header>

    <section id="home" class="hero"> 
     <div class="hero-content"> 
        <img src="" alt="">
     </div>
    </section>

    <section>
        <div class="navbar2">
          <img src="img5.png" alt="">
        </div>
    </section>    

    <section>
        <div id="menu" class="menu-grid"> 
            <div class="img2"><img src="https://www.cafecoffeeday.com/sites/default/files/What%2527sNew-Open-copy_0.gif" alt=""></div>
            <div class="img2"><img src="https://www.cafecoffeeday.com/sites/default/files/map-locator.gif" alt="">
            </div>
           <div class="img2"><img src="https://www.cafecoffeeday.com/sites/default/files/Shop%20now%20gif%20new.gif" alt=""></div>
        </div>
    </section>
</body>
</html>
